name: OTA Bundle

on:
  push:
    branches:
      - 'release/*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Create bundle.zip
        run: cd frontend/dist && zip -r ../../bundle.zip .

      - name: Publish bundle.zip to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/heads/release/}"

          if gh release view "$TAG" &>/dev/null; then
            # Release exists — just replace bundle.zip
            gh release upload "$TAG" bundle.zip --clobber
            echo "Updated bundle.zip on existing release $TAG"
          else
            # No release yet — create one with bundle.zip
            gh release create "$TAG" \
              --target "${GITHUB_SHA}" \
              --title "TradeEdge $TAG" \
              --notes "Android OTA bundle — auto-published by CI" \
              bundle.zip
            echo "Created release $TAG with bundle.zip"
          fi
