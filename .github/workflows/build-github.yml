name: Build Releases (GitHub)

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'main'
      - 'release/*'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  # ── Lightweight job: runs only on main pushes ─────────────────────────
  # Seeds the keystore cache on the default branch so every tag-triggered
  # build can restore it. GitHub cache from main is accessible to all
  # branches and tags.
  prime-keystore:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Restore keystore cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Generate keystore (first push to main only)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null
          echo "✓ Keystore generated and cached on main branch"
          echo "  All future tag builds will restore this exact keystore."

  # Delete all leftover artifacts from previous runs before starting new builds.
  # Keeps the 0.5 GB storage limit from filling up across failed/partial runs.
  cleanup-artifacts:
    if: >
      github.server_url == 'https://github.com' &&
      github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete all existing artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          IDS=$(gh api "repos/${REPO}/actions/artifacts" \
            --jq '[.artifacts[] | select(.expired == false) | .id] | .[]' 2>/dev/null || echo "")
          if [ -z "$IDS" ]; then
            echo "No artifacts to delete"
          else
            for id in $IDS; do
              gh api -X DELETE "repos/${REPO}/actions/artifacts/${id}" && echo "Deleted artifact $id"
            done
          fi
          echo "Pre-cleanup complete"

  build-windows:
    if: >
      github.server_url == 'https://github.com' &&
      github.ref != 'refs/heads/main'
    needs: [cleanup-artifacts]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Build backend
        run: npm run build --workspace=backend

      - name: Prepare backend node_modules for bundling
        run: node scripts/prep-backend-bundle.js

      - name: Copy electron to workspace node_modules
        shell: pwsh
        run: |
          $src = Resolve-Path "node_modules/electron"
          $dst = "electron/node_modules/electron"
          New-Item -ItemType Directory -Force "electron/node_modules" | Out-Null
          if (-not (Test-Path $dst)) { Copy-Item -Recurse -Force $src $dst }
          $ver = (Get-Content "$dst/package.json" | ConvertFrom-Json).version
          Write-Host "electron $ver ready"

      - name: Copy electron-updater to workspace node_modules
        shell: pwsh
        run: |
          $src = Resolve-Path "node_modules/electron-updater"
          $dst = "electron/node_modules/electron-updater"
          New-Item -ItemType Directory -Force "electron/node_modules" | Out-Null
          if (-not (Test-Path $dst)) { Copy-Item -Recurse -Force $src $dst }
          Write-Host "electron-updater ready"

      - name: Build Windows installer
        shell: pwsh
        working-directory: electron
        run: npx electron-builder --win --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find and rename installer
        shell: pwsh
        run: |
          $files = Get-ChildItem "electron/out" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
          if (-not $files) {
            Get-ChildItem "electron/out" -Recurse | ForEach-Object { Write-Host $_.FullName }
            Write-Error "No .exe found"
            exit 1
          }
          $src = $files | Select-Object -First 1
          Write-Host "Found: $($src.FullName)"
          Copy-Item $src.FullName "electron/out/TradeEdge-Setup-x64.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            electron/out/TradeEdge-Setup-x64.exe
            electron/out/latest.yml
          retention-days: 1

  build-android:
    if: >
      github.server_url == 'https://github.com' &&
      github.ref != 'refs/heads/main'
    needs: [cleanup-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── Android signing keystore ──────────────────────────────────────
      # Restore the keystore cached by the prime-keystore job (which runs
      # on every main push). Same key used every build → same APK signature
      # → users can install updates over existing installs.
      - name: Restore Android signing keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Generate Android signing keystore (cache miss fallback)
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null
          echo "✓ New keystore generated (cache was empty)"

      - name: Verify keystore
        run: |
          keytool -list -keystore ~/.android/debug.keystore -storepass android -noprompt
          echo "✓ Keystore ready"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Create OTA bundle zip
        run: cd frontend/dist && zip -r ../../bundle.zip .

      - name: Copy web assets into Android platform
        run: |
          mkdir -p frontend/android/app/src/main/assets/public
          cp -r frontend/dist/. frontend/android/app/src/main/assets/public/

      - name: Write local.properties
        working-directory: frontend/android
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$SDK" > local.properties

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -PversionCode=${{ github.run_number }}
        env:
          GRADLE_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: Rename APK
        run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk TradeEdge.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            TradeEdge.apk
            bundle.zip
          retention-days: 1

  create-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: >
      always() &&
      github.server_url == 'https://github.com' &&
      github.ref != 'refs/heads/main' &&
      (needs.build-windows.result == 'success' || needs.build-android.result == 'success')
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/
        continue-on-error: true

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: dist/
        continue-on-error: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REF="${GITHUB_REF}"
          if [[ "$REF" == refs/tags/* ]]; then
            TAG="${REF#refs/tags/}"
          elif [[ "$REF" == refs/heads/release/* ]]; then
            TAG="${REF#refs/heads/release/}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "Tag: $TAG"

          cat > release-notes.md << 'NOTES'
          ## Downloads
          - **Windows 10/11** — TradeEdge-Setup-x64.exe (auto-updates silently)
          - **Android 7+** — TradeEdge.apk (enable Install unknown apps, then tap to install)

          ## Quick Start
          Both apps launch with live market data immediately — no backend required.
          Add your free FMP key in Settings to unlock all research features.
          NOTES

          FILES=""
          [ -f dist/TradeEdge-Setup-x64.exe ] && FILES="$FILES dist/TradeEdge-Setup-x64.exe"
          [ -f dist/latest.yml ]              && FILES="$FILES dist/latest.yml"
          [ -f dist/TradeEdge.apk ]           && FILES="$FILES dist/TradeEdge.apk"
          [ -f dist/bundle.zip ]              && FILES="$FILES dist/bundle.zip"

          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --target "${GITHUB_SHA}" \
            --title "TradeEdge ${TAG}" \
            --notes-file release-notes.md \
            $FILES

      - name: Delete all artifacts to free storage
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          IDS=$(gh api "repos/${REPO}/actions/artifacts" \
            --jq '[.artifacts[] | select(.expired == false) | .id] | .[]' 2>/dev/null || echo "")
          for id in $IDS; do
            gh api -X DELETE "repos/${REPO}/actions/artifacts/${id}" && echo "Deleted artifact $id"
          done
          echo "Post-cleanup complete"
