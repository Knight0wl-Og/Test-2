name: Create Release Placeholder

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.version }}"
          gh release create "$TAG" \
            --target "${GITHUB_SHA}" \
            --title "TradeEdge $TAG" \
            --prerelease \
            --notes "## TradeEdge $TAG

          > Binaries are being built by CI. Check back in ~20 minutes for the installer downloads.

          ### Coming shortly:
          - \`TradeEdge-Setup-x64.exe\` — Windows 10/11 installer
          - \`TradeEdge.apk\` — Android 7+ APK

          ### Source install (available now)
          \`\`\`bash
          git clone https://github.com/${{ github.repository }}
          cd Test-2
          npm install
          npm run dev
          \`\`\`

          See [INSTALL.md](https://github.com/${{ github.repository }}/blob/claude/tradeedge-trading-app-HfsvG/INSTALL.md) for full instructions."
