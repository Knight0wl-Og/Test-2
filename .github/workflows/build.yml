name: Build Releases

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Build backend
        run: npm run build --workspace=backend

      - name: Prepare backend node_modules for bundling
        run: node scripts/prep-backend-bundle.js

      - name: Copy electron to workspace node_modules
        run: |
          mkdir -p electron/node_modules
          if [ ! -d "electron/node_modules/electron" ]; then
            cp -r node_modules/electron electron/node_modules/electron
          fi
          echo "electron ready"

      - name: Copy electron-updater to workspace node_modules
        run: |
          mkdir -p electron/node_modules
          if [ ! -d "electron/node_modules/electron-updater" ]; then
            cp -r node_modules/electron-updater electron/node_modules/electron-updater
          fi
          echo "electron-updater ready"

      - name: Build Linux AppImage
        working-directory: electron
        run: npx electron-builder --linux --publish=never
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-app
          path: electron/out/*.AppImage
          retention-days: 3

  build-android:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # Java 21 required: @capacitor/browser compiles with sourceCompatibility VERSION_21
      # Install via apt to avoid dependency on data.forgejo.org action mirror
      - name: Setup Java 21
        run: |
          apt-get update -qq
          apt-get install -y openjdk-21-jdk-headless
          JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH
          java -version

      - name: Setup Android SDK manually
        run: |
          apt-get update -qq && apt-get install -y wget unzip
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          mkdir -p /opt/android-sdk/cmdline-tools
          unzip -q /tmp/cmdtools.zip -d /opt/android-sdk/cmdline-tools
          mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          rm /tmp/cmdtools.zip
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "/opt/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/opt/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "Android SDK installed at /opt/android-sdk"

      - name: Install Android SDK platform 34
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Create OTA bundle zip
        run: cd frontend/dist && zip -r ../../bundle.zip .

      # Skip 'cap sync' (fragile, needs TS compilation) — android/ is committed.
      # Just copy the built web assets into the platform assets folder directly.
      - name: Copy web assets into Android platform
        run: |
          mkdir -p frontend/android/app/src/main/assets/public
          cp -r frontend/dist/. frontend/android/app/src/main/assets/public/
          echo "Assets copied:"
          ls frontend/android/app/src/main/assets/public/ | head -10

      - name: Write local.properties (Android SDK path)
        working-directory: frontend/android
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$SDK" > local.properties
          echo "sdk.dir is: $SDK"

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --info
        env:
          GRADLE_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: Rename APK
        run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk TradeEdge.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            TradeEdge.apk
            bundle.zip
          retention-days: 3

  create-release:
    needs: [build-desktop, build-android]
    runs-on: self-hosted
    if: always() && (needs.build-desktop.result == 'success' || needs.build-android.result == 'success')
    steps:
      - uses: actions/checkout@v4

      - name: Download desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-app
          path: dist/
        continue-on-error: true

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: dist/
        continue-on-error: true

      - name: List downloaded files
        run: ls -lh dist/ || echo "dist/ is empty"

      - name: Create Codeberg Release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REF="${GITHUB_REF}"
          if [[ "$REF" == refs/tags/* ]]; then
            TAG="${REF#refs/tags/}"
          elif [[ "$REF" == refs/heads/release/* ]]; then
            TAG="${REF#refs/heads/release/}"
          else
            TAG="v3.0.0"
          fi

          echo "Creating release for tag: $TAG"

          RESP=$(curl -s -X POST \
            "https://codeberg.org/api/v1/repos/Knight0wl/TradeEdge/releases" \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"tag_name\": \"$TAG\",
              \"name\": \"TradeEdge $TAG\",
              \"draft\": false,
              \"prerelease\": false,
              \"body\": \"## TradeEdge $TAG\n\n### What's New in v3.0.0\n- MarketBrief AI slide deck (Gemini/Groq powered, swipeable slides)\n- Full Research Hub with 13 feature pages\n- Intel Library, Covered Call ETFs, Dividends, Earnings suite, Economic Calendar\n- EPS & Valuation, ETF Flows, P/E Analyzer, Profitability Compare, Technicals\n- Research Hub section in Sidebar\n- Android build improvements\n\n### Downloads\n| Platform | File | Notes |\n|---|---|---|\n| Linux (64-bit) | \`TradeEdge.AppImage\` | \`chmod +x\` then run |\n| Android 7+ | \`TradeEdge.apk\` | Enable 'Install unknown apps', tap to install |\n\n### Quick Start\nBoth apps launch with live market data immediately — no backend required. Add your free FMP key in Settings to unlock all 13 research features.\"
            }")

          echo "Release response: $RESP"
          RELEASE_ID=$(echo "$RESP" | jq -r '.id')

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "ERROR: Failed to create release"
            exit 1
          fi

          echo "Release ID: $RELEASE_ID"

          # Upload AppImage
          for f in dist/*.AppImage; do
            [ -f "$f" ] || continue
            FNAME=$(basename "$f")
            echo "Uploading $FNAME..."
            curl -s -X POST \
              "https://codeberg.org/api/v1/repos/Knight0wl/TradeEdge/releases/$RELEASE_ID/assets?name=$FNAME" \
              -H "Authorization: token $TOKEN" \
              -F "attachment=@$f"
            echo ""
          done

          # Upload APK
          if [ -f dist/TradeEdge.apk ]; then
            echo "Uploading TradeEdge.apk..."
            curl -s -X POST \
              "https://codeberg.org/api/v1/repos/Knight0wl/TradeEdge/releases/$RELEASE_ID/assets?name=TradeEdge.apk" \
              -H "Authorization: token $TOKEN" \
              -F "attachment=@dist/TradeEdge.apk"
            echo ""
          fi

          # Upload OTA bundle
          if [ -f dist/bundle.zip ]; then
            echo "Uploading bundle.zip..."
            curl -s -X POST \
              "https://codeberg.org/api/v1/repos/Knight0wl/TradeEdge/releases/$RELEASE_ID/assets?name=bundle.zip" \
              -H "Authorization: token $TOKEN" \
              -F "attachment=@dist/bundle.zip"
            echo ""
          fi

          echo "Done: https://codeberg.org/Knight0wl/TradeEdge/releases/tag/$TAG"
