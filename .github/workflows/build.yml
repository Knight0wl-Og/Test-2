name: Build Releases

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Build backend
        run: npm run build --workspace=backend

      - name: Build Windows installer
        run: npm run build:win --workspace=electron

      - name: Rename installer
        shell: pwsh
        run: |
          $src = Get-ChildItem "electron/out" -Filter "*.exe" | Select-Object -First 1
          Copy-Item $src.FullName "electron/out/TradeEdge-Setup-x64.exe"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: electron/out/TradeEdge-Setup-x64.exe
          retention-days: 3

  build-android:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Add Android platform
        working-directory: frontend
        run: npx cap add android 2>/dev/null || true

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk TradeEdge.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: TradeEdge.apk
          retention-days: 3

  create-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: always() && needs.build-windows.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist/
        continue-on-error: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Derive tag from refs/tags/vX.X.X or refs/heads/release/vX.X.X
          REF="${GITHUB_REF}"
          if [[ "$REF" == refs/tags/* ]]; then
            TAG="${REF#refs/tags/}"
          elif [[ "$REF" == refs/heads/release/* ]]; then
            TAG="${REF#refs/heads/release/}"
          else
            TAG="v1.0.0"
          fi

          # Build file list — include only files that exist
          FILES=""
          [ -f dist/TradeEdge-Setup-x64.exe ] && FILES="$FILES dist/TradeEdge-Setup-x64.exe"
          [ -f dist/TradeEdge.apk ] && FILES="$FILES dist/TradeEdge.apk"

          gh release create "$TAG" \
            --title "TradeEdge $TAG" \
            --notes "## TradeEdge $TAG

          ### Downloads
          | Platform | File | Notes |
          |---|---|---|
          | Windows 10/11 (64-bit) | \`TradeEdge-Setup-x64.exe\` | Run installer — no admin rights needed |
          | Android 7+ | \`TradeEdge.apk\` | Enable \"Install unknown apps\", tap APK to install |

          ### Quick Start
          Both apps launch with **demo market data** immediately — no account, backend, or internet required.

          ### Connect Android to Live Data
          1. Run \`npm run dev\` on your PC (or deploy backend to Render/Railway)
          2. Open app → tap ⚙ → enter your backend URL (e.g. \`http://192.168.1.x:3001\`)
          3. Tap **Save & Reload**

          See [INSTALL.md](https://github.com/${{ github.repository }}/blob/main/INSTALL.md) for full setup instructions." \
            $FILES
