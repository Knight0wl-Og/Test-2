name: Build Releases

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Node & JS deps ────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # ── Frontend & Backend ────────────────────────────────────────────
      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Build backend
        run: npm run build --workspace=backend

      - name: Prepare backend node_modules for bundling
        run: node scripts/prep-backend-bundle.js

      # ── Electron (Linux AppImage) ─────────────────────────────────────
      - name: Copy electron deps to workspace node_modules
        run: |
          mkdir -p electron/node_modules
          [ -d electron/node_modules/electron ] || cp -r node_modules/electron electron/node_modules/electron
          [ -d electron/node_modules/electron-updater ] || cp -r node_modules/electron-updater electron/node_modules/electron-updater

      - name: Build Linux AppImage
        working-directory: electron
        run: npx electron-builder --linux --publish=never
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1

      - name: Verify AppImage
        run: ls -lh electron/out/*.AppImage

      # ── Java 21 ───────────────────────────────────────────────────────
      - name: Setup Java 21
        run: |
          apt-get update -qq
          apt-get install -y wget gnupg apt-transport-https unzip zip
          wget -q https://packages.adoptium.net/artifactory/api/gpg/key/public -O /tmp/adoptium.gpg
          gpg --dearmor < /tmp/adoptium.gpg > /etc/apt/trusted.gpg.d/adoptium.gpg
          rm /tmp/adoptium.gpg
          . /etc/os-release
          echo "deb https://packages.adoptium.net/artifactory/deb ${VERSION_CODENAME} main" > /etc/apt/sources.list.d/adoptium.list
          apt-get update -qq
          apt-get install -y temurin-21-jdk
          JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH
          java -version

      # ── Android SDK ───────────────────────────────────────────────────
      - name: Setup Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          mkdir -p /opt/android-sdk/cmdline-tools
          unzip -q /tmp/cmdtools.zip -d /opt/android-sdk/cmdline-tools
          mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          rm /tmp/cmdtools.zip
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "/opt/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/opt/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Install Android SDK platform 36
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # ── Android signing keystore ──────────────────────────────────────
      # On the very first build the keystore is generated and committed back
      # to the repo so every subsequent build reuses the exact same file —
      # this is what allows "install over existing APK" without any manual
      # secret setup.
      - name: Setup Android signing keystore
        run: |
          KEYSTORE_REPO="frontend/android/app/tradeedge-debug.keystore"
          KEYSTORE_HOME="$HOME/.android/debug.keystore"
          mkdir -p $HOME/.android

          if [ -f "$KEYSTORE_REPO" ]; then
            cp "$KEYSTORE_REPO" "$KEYSTORE_HOME"
            echo "✓ Keystore loaded from repo"
          else
            echo "First run — generating debug keystore and committing to repo..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_HOME" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null
            cp "$KEYSTORE_HOME" "$KEYSTORE_REPO"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add -f "$KEYSTORE_REPO"
            git commit -m "ci: store Android debug keystore for consistent APK signing"
            git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
            git push origin HEAD:refs/heads/main || exit 1
            echo "✓ Keystore generated and committed — all future builds use this keystore"
          fi

      # ── Android APK ───────────────────────────────────────────────────
      - name: Create OTA bundle zip
        run: cd frontend/dist && zip -r ../../bundle.zip .

      - name: Copy web assets into Android platform
        run: |
          mkdir -p frontend/android/app/src/main/assets/public
          cp -r frontend/dist/. frontend/android/app/src/main/assets/public/

      - name: Write local.properties
        working-directory: frontend/android
        run: echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx1536m -XX:MaxMetaspaceSize=384m"

      - name: Verify APK
        run: ls -lh frontend/android/app/build/outputs/apk/debug/app-debug.apk

      # ── Create GitHub Release ─────────────────────────────────────────
      - name: Create GitHub Release and upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REF="${GITHUB_REF}"
          if [[ "$REF" == refs/tags/* ]]; then
            TAG="${REF#refs/tags/}"
          elif [[ "$REF" == refs/heads/release/* ]]; then
            TAG="${REF#refs/heads/release/}"
          else
            TAG="v3.5.4"
          fi
          echo "Tag: $TAG"

          # Delete any existing release for this tag
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true

          # Collect assets
          ASSETS=()
          for f in electron/out/*.AppImage; do
            [ -f "$f" ] && ASSETS+=("$f")
          done
          APK="frontend/android/app/build/outputs/apk/debug/app-debug.apk"
          [ -f "$APK" ] && ASSETS+=("$APK#TradeEdge.apk")
          [ -f bundle.zip ] && ASSETS+=("bundle.zip")

          # Create release and upload all assets
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "TradeEdge $TAG" \
            --notes "## TradeEdge $TAG

### Downloads
| Platform | File | Notes |
|---|---|---|
| Linux (64-bit) | \`TradeEdge.AppImage\` | \`chmod +x\` then run |
| Android 7+ | \`TradeEdge.apk\` | Enable 'Install unknown apps', tap to install |

### Quick Start
Both apps launch with live market data immediately — no backend required. Add your free FMP key in Settings to unlock research features." \
            "${ASSETS[@]}"

          echo "Done: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
