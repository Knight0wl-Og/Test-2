name: Build Releases

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Build backend
        run: npm run build --workspace=backend

      - name: Prepare backend node_modules for bundling
        run: node scripts/prep-backend-bundle.js

      - name: Copy electron to workspace node_modules
        shell: pwsh
        run: |
          $src = Resolve-Path "node_modules/electron"
          $dst = "electron/node_modules/electron"
          New-Item -ItemType Directory -Force "electron/node_modules" | Out-Null
          if (-not (Test-Path $dst)) { Copy-Item -Recurse -Force $src $dst }
          $ver = (Get-Content "$dst/package.json" | ConvertFrom-Json).version
          Write-Host "electron $ver ready"

      - name: Copy electron-updater to workspace node_modules
        shell: pwsh
        run: |
          $src = Resolve-Path "node_modules/electron-updater"
          $dst = "electron/node_modules/electron-updater"
          New-Item -ItemType Directory -Force "electron/node_modules" | Out-Null
          if (-not (Test-Path $dst)) { Copy-Item -Recurse -Force $src $dst }
          Write-Host "electron-updater ready"

      - name: Build Windows installer
        shell: pwsh
        working-directory: electron
        run: npx electron-builder --win --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find and rename installer
        shell: pwsh
        run: |
          $files = Get-ChildItem "electron/out" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
          if (-not $files) {
            Get-ChildItem "electron/out" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            Write-Error "No .exe found"
            exit 1
          }
          $src = $files | Select-Object -First 1
          Write-Host "Found: $($src.FullName)"
          Copy-Item $src.FullName "electron/out/TradeEdge-Setup-x64.exe"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            electron/out/TradeEdge-Setup-x64.exe
            electron/out/latest.yml
          retention-days: 3

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Create web bundle for OTA updates
        run: cd frontend/dist && zip -r ../../bundle.zip .

      - name: Add Android platform (if missing)
        working-directory: frontend
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "android/ already present, skipping cap add"
          fi

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Write local.properties
        working-directory: frontend/android
        run: |
          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$SDK_PATH" > local.properties
          echo "Android SDK path: $SDK_PATH"

      - name: Make gradlew executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk TradeEdge.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            TradeEdge.apk
            bundle.zip
          retention-days: 3

  create-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: always() && (needs.build-windows.result == 'success' || needs.build-android.result == 'success')
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist/
        continue-on-error: true

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: dist/
        continue-on-error: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REF="${GITHUB_REF}"
          if [[ "$REF" == refs/tags/* ]]; then
            TAG="${REF#refs/tags/}"
          elif [[ "$REF" == refs/heads/release/* ]]; then
            TAG="${REF#refs/heads/release/}"
          else
            TAG="v1.0.0"
          fi

          FILES=""
          [ -f dist/TradeEdge-Setup-x64.exe ] && FILES="$FILES dist/TradeEdge-Setup-x64.exe"
          [ -f dist/latest.yml ] && FILES="$FILES dist/latest.yml"
          [ -f dist/TradeEdge.apk ] && FILES="$FILES dist/TradeEdge.apk"
          [ -f dist/bundle.zip ] && FILES="$FILES dist/bundle.zip"

          gh release delete "$TAG" --yes 2>/dev/null || true

          gh release create "$TAG" \
            --target "${GITHUB_SHA}" \
            --title "TradeEdge $TAG" \
            --notes "## TradeEdge $TAG

          ### Downloads
          | Platform | File | Notes |
          |---|---|---|
          | Windows 10/11 (64-bit) | \`TradeEdge-Setup-x64.exe\` | Installer — auto-updates silently after install |
          | Android 7+ | \`TradeEdge.apk\` | Enable \"Install unknown apps\", tap APK to install |

          ### Auto-Updates
          - **Windows**: The app checks for updates on launch and installs them when you quit.
          - **Android**: The app downloads new versions silently and reloads automatically.

          ### Quick Start
          Both apps launch with **live market data** immediately — no backend required.

          See [INSTALL.md](https://github.com/${{ github.repository }}/blob/main/INSTALL.md) for full setup instructions." \
            $FILES
