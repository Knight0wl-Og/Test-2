<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>TradeEdge — Connecting…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; display: flex; align-items: center; justify-content: center;
           min-height: 100vh; font-family: system-ui, sans-serif;
           background: #0a0a0f; color: #fff; text-align: center; }
    .box { padding: 2rem; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.15);
               border-top-color: #6366f1; border-radius: 50%;
               animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #9ca3af; font-size: 0.9rem; margin: 0; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Returning to TradeEdge…</p>
  </div>
  <script>
    // Forward the Schwab OAuth code back into the TradeEdge app via deep link
    var params = new URLSearchParams(window.location.search);
    var code  = params.get('code');
    var error = params.get('error');

    if (code) {
      window.location.href = 'tradeedge://oauth/callback?code=' + encodeURIComponent(code);
    } else if (error) {
      document.querySelector('p').textContent = 'Authorization cancelled (' + error + '). You can close this tab.';
      document.querySelector('.spinner').style.display = 'none';
    } else {
      document.querySelector('p').textContent = 'No code received. Please try connecting again.';
      document.querySelector('.spinner').style.display = 'none';
    }
  </script>
</body>
</html>
